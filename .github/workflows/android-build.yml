name: android-build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev aidl wget

      - name: Cache buildozer + SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          # 锁定 Cython < 3.0.0 和 setuptools < 71.0.0，以兼容 buildozer 1.5.0
          pip install "Cython<3.0.0" "setuptools<71.0.0" buildozer==1.5.0

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "====== 确认 Java 版本 ======"
          java -version
          
          echo "====== 确认 Cython 版本 ======"
          cython --version
          
          echo "====== 设置 Buildozer 环境变量 ======"
          # 显式指定 SDK 和 NDK 路径，避免 buildozer 自动下载时出错
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25b"  # 指定一个兼容的 NDK 版本
          
          echo "====== 修复 SDK 路径 (伪造 sdkmanager) ======"
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          
          if [ ! -d "$SDK_DIR/cmdline-tools" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$SDK_DIR"
          fi
          
          mkdir -p "$SDK_DIR/tools/bin"
          if [ -d "$SDK_DIR/cmdline-tools/bin" ]; then
            cp -r "$SDK_DIR/cmdline-tools/bin/"* "$SDK_DIR/tools/bin/" || true
            cp -r "$SDK_DIR/cmdline-tools/lib" "$SDK_DIR/tools/" || true
          fi
          
          echo "====== 主动安装 Android API 33 环境 ======"
          yes | "$SDK_DIR/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true
          
          echo "====== 修复 aidl ======"
          for v in 35.0.0 34.0.0 33.0.2 33.0.0 32.0.0 31.0.0 30.0.3 29.0.3; do
            mkdir -p "$SDK_DIR/build-tools/$v"
            sudo ln -sf /usr/bin/aidl "$SDK_DIR/build-tools/$v/aidl"
          done
          
          echo "====== 清理旧构建并开始打包 ======"
          buildozer android clean || true
          # 将 buildozer 的输出同时写入日志文件，方便排查
          buildozer -v android debug 2>&1 | tee buildozer-debug.log

      - name: Verify APK packaging rules
        run: |
          APK=$(ls bin/*.apk | head -n1)
          echo "APK=$APK"
          unzip -l "$APK" | tee apk-contents.txt
          if unzip -l "$APK" | grep -E "(^|/)tests/|(^|/)docs/|(^|/)tools/"; then
            echo "::error::APK 内包含 tests/docs/tools，须检查 source.exclude_dirs"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "NotoSansSC-Regular.otf"; then
            echo "::error::字体未进 APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-debug-apk
          path: bin/*.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            buildozer-debug.log
            apk-contents.txt
            .buildozer/android/platform/build-*/build.log
