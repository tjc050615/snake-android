name: android-build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev aidl

      - name: Cache buildozer + SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "====== 确认 Java 版本 ======"
          java -version
          
          echo "====== 修复 aidl ======"
          for v in 35.0.0 34.0.0 33.0.0 32.0.0 31.0.0 30.0.3 29.0.3; do
            mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/$v
            sudo ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/$v/aidl
          done
          
          echo "====== 开始打包 ======"
          buildozer -v android debug 2>&1 | tee buildozer-debug.log

      - name: Verify APK packaging rules
        run: |
          APK=$(ls bin/*.apk | head -n1)
          echo "APK=$APK"
          unzip -l "$APK" | tee apk-contents.txt
          if unzip -l "$APK" | grep -E "(^|/)tests/|(^|/)docs/|(^|/)tools/"; then
            echo "::error::APK 内包含 tests/docs/tools，须检查 source.exclude_dirs"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "NotoSansSC-Regular.otf"; then
            echo "::error::字体未进 APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-debug-apk
          path: bin/*.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            buildozer-debug.log
            apk-contents.txt
            .buildozer/android/platform/build-*/build.log
